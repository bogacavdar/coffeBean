name: Godot Windows deneme
# godot-tasarim dalındaki Godot denemesini Windows için derler ve
# "godot-deneme" sürümüne (Releases) indirilebilir zip olarak koyar.
on:
  push:
    branches: [godot-tasarim]
    paths: ['godot/deneme-3b/**', '.github/workflows/godot-windows.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: godot-windows
  cancel-in-progress: true
jobs:
  windows:
    runs-on: ubuntu-latest
    env:
      GODOT: "4.7.2"
    steps:
      - uses: actions/checkout@v4
      - name: Godot ve dışa aktarım şablonlarını kur
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT}-stable/Godot_v${GODOT}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT}-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT}-stable/Godot_v${GODOT}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT}-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT}.stable
          mv templates/* ~/.local/share/godot/export_templates/${GODOT}.stable/
      - name: Windows için dışa aktar
        run: |
          G=$PWD/Godot_v${GODOT}-stable_linux.x86_64
          cd godot/deneme-3b
          $G --headless --import || true
          mkdir -p build
          $G --headless --export-release "Windows Desktop" build/CoffeBean_BirinciSahis.exe
          ls -la build
          cd build && zip -9 $GITHUB_WORKSPACE/CoffeBean_Godot_Deneme_Windows.zip CoffeBean_BirinciSahis.exe
      - name: Sürüme koy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete godot-deneme --yes --cleanup-tag || true
          gh release create godot-deneme CoffeBean_Godot_Deneme_Windows.zip \
            --target ${{ github.sha }} --prerelease \
            --title "CoffeBean Godot denemesi (Windows)" \
            --notes "Zip'i açıp CoffeBean_BirinciSahis.exe'yi çalıştırın. WASD yürü, fare bak, E / sol tık etkileşim, Boşluk tamam, R kaşık, Esc fareyi bırakır. Görsel ve his denemesidir, oyun değildir. Modeller: Poly Haven (CC0), insanlar: Microsoft Rocketbox (MIT). Commit: ${{ github.sha }}"
