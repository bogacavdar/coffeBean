<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>CoffeBean</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
<style>
  :root{--krema:#f6efe3;--kagit:#fbf7f0;--kahve:#2b2117;--karamel:#a9744f;--zeytin:#6f7d4a;--kiremit:#b5533c;--cizgi:#e4d9c6;--soluk:#8b7a6a;--iyi:#5f8a4b;--kotu:#b5533c;--altin:#c9962b}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{margin:0;height:100%;background:#1c1713;color:var(--kahve);font:15px/1.45 "Segoe UI",system-ui,sans-serif;overflow:hidden}
  button{font:inherit;cursor:pointer;border:1px solid var(--cizgi);background:var(--kagit);color:var(--kahve);border-radius:10px;padding:8px 14px}
  button.pri{background:var(--kiremit);color:#fff;border-color:var(--kiremit)}
  button:disabled{opacity:.45;cursor:default}
  #scene{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:pointer}
  /* HUD – §11: büyük ve belirgin, tek bakışta okunur */
  #hud{position:fixed;top:0;left:0;right:0;display:flex;gap:10px;align-items:center;padding:12px 16px;background:linear-gradient(rgba(20,12,6,.85),rgba(20,12,6,.1));color:#f6efe3;font-size:19px;font-weight:600;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.7);flex-wrap:wrap;z-index:2}
  #hud b{color:#ffd89a;font-weight:800;font-size:1.08em}
  #hud .sp{flex:1}
  #hud .pill{background:rgba(0,0,0,.4);padding:6px 14px;border-radius:14px;border:1px solid rgba(255,216,154,.25)}
  #hud .pill.money b{color:#8fd97a}
  #hud .pill.xp{font-size:.82em}
  #hud .pill.warn{background:rgba(181,83,60,.75);border-color:#ffb49a}
  #hud .pill.debt{background:rgba(120,30,20,.6);color:#ffc9b8}
  #hud .pill.streak{background:rgba(201,150,43,.55)}
  #hud .pill.next{background:rgba(111,125,74,.6)}
  #task{position:fixed;top:66px;left:16px;z-index:2;background:rgba(251,247,240,.92);color:var(--kahve);padding:7px 14px;border-radius:14px;font-size:15px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.3);pointer-events:none;max-width:70vw}
  #task.done{background:rgba(111,125,74,.95);color:#fff}#task.failed{background:rgba(181,83,60,.9);color:#fff}
  /* köşe ikonları (§11) – büyük, kolay dokunulur */
  #icons{position:fixed;right:14px;bottom:14px;display:flex;flex-direction:column;gap:14px;z-index:3}
  .icon{width:84px;height:84px;border-radius:20px;background:rgba(251,247,240,.95);border:1px solid var(--cizgi);box-shadow:0 8px 22px rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:600;color:var(--kahve);cursor:pointer;position:relative}
  .icon svg{width:36px;height:36px}
  .icon .badge{position:absolute;top:-7px;right:-7px;background:var(--kiremit);color:#fff;border-radius:12px;font-size:12px;padding:2px 8px;font-weight:700}
  #openDay{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:3;font-size:18px;padding:14px 28px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
  #hint{position:fixed;left:12px;bottom:14px;z-index:2;font-size:12px;color:#f6efe3;background:rgba(0,0,0,.4);padding:4px 10px;border-radius:10px;pointer-events:none}
  /* mini oyun paneli – §11: sahnenin ORTASINDA büyük bir kart, alttan şerit değil */
  #sheet{position:fixed;inset:0;background:rgba(20,14,9,.74);display:none;align-items:center;justify-content:center;padding:16px;z-index:5}
  #sheet.on{display:flex}
  #sheet .wrap{background:var(--kagit);border-radius:24px;box-shadow:0 26px 70px rgba(0,0,0,.5);max-width:760px;width:100%;max-height:96vh;overflow:auto;padding:16px 24px 20px;text-align:center}
  #sheet h3{margin:4px 0 2px;font-size:22px}
  .steps{display:flex;gap:6px;justify-content:center;margin:8px 0 10px;flex-wrap:wrap}
  .steps span{font-size:13px;padding:4px 11px;border-radius:12px;background:#eee4d4;color:var(--soluk)}
  .steps span.done{background:var(--zeytin);color:#fff}.steps span.now{background:var(--kiremit);color:#fff}
  #closeup{width:min(100%, calc(30vh * 640 / 340));max-width:640px;aspect-ratio:640/340;display:block;margin:4px auto;border-radius:16px;box-shadow:0 10px 30px rgba(40,25,10,.3)}
  .ctrl{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:10px;flex-wrap:wrap}
  .hold{width:100%;max-width:640px;padding:20px;font-size:18px;border-radius:16px;touch-action:none}
  input[type=range]{width:260px}
  .hint{color:var(--soluk);font-size:14px;min-height:18px;margin-top:8px}
  .score{font-size:16px;margin-top:6px;min-height:22px;font-weight:600}.score.good{color:var(--iyi)}.score.bad{color:var(--kotu)}
  .tabs{display:flex;gap:6px;justify-content:center;margin-bottom:6px}.tabs button.on{background:var(--kahve);color:#fff}
  /* §4 renkli hedef çubuğu */
  .zbar{position:relative;height:52px;max-width:640px;margin:16px auto 4px;background:#e6ddcd;border-radius:14px;box-shadow:inset 0 2px 7px rgba(0,0,0,.18)}
  .zbar .zb{position:absolute;top:0;bottom:0}.zbar .zb.ok{background:#e9c46a}.zbar .zb.good{background:#9cc77a}.zbar .zb.perf{background:#3f7d34}
  .zneedle{position:absolute;top:-7px;bottom:-7px;width:7px;margin-left:-3.5px;background:#111;border-radius:4px;box-shadow:0 0 0 2px rgba(255,255,255,.85),0 3px 8px rgba(0,0,0,.4)}
  .zends{display:flex;justify-content:space-between;align-items:center;max-width:640px;margin:2px auto 0;font-size:14px;color:var(--soluk);font-weight:600}
  .zleg{font-size:12px;font-weight:500}.zleg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin:0 3px 0 8px;vertical-align:-1px}.zleg i.perf{background:#3f7d34}.zleg i.good{background:#9cc77a}.zleg i.ok{background:#e9c46a}
  button.big{display:block;margin:14px auto 0;font-size:26px;font-weight:800;letter-spacing:1.5px;padding:22px;max-width:640px;width:100%;border-radius:18px;box-shadow:0 6px 0 #8d3b29}
  button.big:active{transform:translateY(4px);box-shadow:0 2px 0 #8d3b29}
  .zres{font-size:22px;font-weight:800;min-height:30px;margin-top:8px}.zres.perfect{color:#3f7d34}.zres.good{color:#5f8a4b}.zres.ok{color:#b58a1e}.zres.miss{color:var(--kotu)}
  .gauge{position:relative;height:12px;background:#eee4d4;border-radius:7px;overflow:hidden;max-width:360px;margin:8px auto}
  .gauge .zone{position:absolute;top:0;bottom:0;background:rgba(111,125,74,.5)}.gauge .needle{position:absolute;top:0;bottom:0;width:3px;background:var(--kahve)}
  .pulse{animation:pulse 1s infinite;outline:3px solid var(--altin);outline-offset:3px;border-radius:14px}
  @keyframes pulse{0%,100%{outline-color:rgba(201,150,43,.2)}50%{outline-color:rgba(201,150,43,1)}}
  /* öğretici balonu (§10) */
  #tut{display:none;background:#fff8e8;border:1px solid #e8d7a8;border-radius:14px;padding:8px 14px;margin:6px auto;max-width:640px;text-align:left;font-size:14px;position:relative}
  #tut.on{display:block}#tut b{color:var(--kiremit)}
  #tut::before{content:"Nejla Teyze";display:block;font-size:11px;color:var(--soluk);margin-bottom:2px}
  /* tam ekran kartlar */
  .overlay{position:fixed;inset:0;background:rgba(28,23,19,.72);display:none;align-items:center;justify-content:center;padding:14px;z-index:9}
  .overlay.on{display:flex}
  .card{background:var(--kagit);border-radius:18px;width:100%;max-width:640px;max-height:92vh;overflow:auto;padding:18px 20px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .card h2{margin:0 0 6px;font-size:22px;display:flex;align-items:center;gap:8px}
  .card h2 .x{margin-left:auto;font-size:14px}
  .box{background:#fff;border:1px solid var(--cizgi);border-radius:12px;padding:12px;margin:10px 0}
  .box h4{margin:0 0 6px}
  table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:6px 8px;border-bottom:1px solid var(--cizgi);text-align:left;vertical-align:top}
  td.num{text-align:right;font-variant-numeric:tabular-nums}tr.total td{font-weight:700;border-top:2px solid var(--kahve)}
  .muted{color:var(--soluk);font-size:13px}.lock{opacity:.5}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;justify-content:flex-end}
  .req{font-size:13px;padding:6px 10px;border-radius:8px;background:#fdeeea;color:var(--kotu)}.req.ok{background:#eef5e8;color:var(--iyi)}
  .recipe{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--cizgi)}.recipe:last-child{border-bottom:0}.recipe .dIcon{flex:none}.recipe.lock{opacity:1}.recipe.lock b{color:var(--soluk);letter-spacing:2px}
  .setrow{display:flex;align-items:center;gap:10px}.setrow input[type=range]{flex:1;width:auto}
  .setrow input[type=checkbox]{width:18px;height:18px}
  /* §11 giriş ekranı: CoffeBean */
  #menu{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse 80% 60% at 50% 32%,#6b4426 0%,#3b2717 45%,#1a110b 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;z-index:8;color:#f6efe3;padding:16px}
  #menu::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 28%,rgba(255,200,120,.22),transparent 45%);pointer-events:none}
  #menu .beans{position:absolute;inset:0;pointer-events:none}
  #menu .bean{position:absolute;top:-60px;width:26px;height:36px;border-radius:50%;background:radial-gradient(ellipse at 35% 30%,#8a5a33,#4a2b16 70%,#2d190c);opacity:.35;animation:beanfall linear infinite}
  #menu .bean::after{content:"";position:absolute;left:46%;top:12%;bottom:12%;width:3px;border-radius:3px;background:rgba(25,12,4,.75);transform:rotate(10deg)}
  @keyframes beanfall{from{transform:translateY(-60px) rotate(0)}to{transform:translateY(calc(100vh + 120px)) rotate(360deg)}}
  #menu .logo{position:relative;width:150px;height:150px;filter:drop-shadow(0 12px 24px rgba(0,0,0,.5))}
  #menu .steam path{fill:none;stroke:rgba(255,240,220,.55);stroke-width:5;stroke-linecap:round;animation:steam 3.2s ease-in-out infinite}
  #menu .steam path:nth-child(2){animation-delay:1.1s}#menu .steam path:nth-child(3){animation-delay:2.1s}
  @keyframes steam{0%{opacity:0;transform:translateY(8px)}40%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
  #menu h1{position:relative;font-family:"Fraunces",Georgia,serif;font-weight:800;font-size:clamp(48px,9vw,82px);margin:0;line-height:1;letter-spacing:.5px;color:#f7e6c8;text-shadow:0 3px 0 #7a4a24,0 10px 30px rgba(0,0,0,.55)}
  #menu h1 span{color:#e6a960}
  #menu .tag{position:relative;max-width:440px;color:#e6d6bf;margin:4px 0 0;font-size:16px}
  #menu .ver{position:relative;font-size:12px;letter-spacing:2px;color:#b89a78;text-transform:uppercase;margin-bottom:8px}
  #menu .mbtns{position:relative;display:flex;flex-direction:column;gap:10px;width:min(320px,90vw)}
  #menu button{font-size:18px;padding:14px 28px;border-radius:16px}
  #menu button.pri{background:#e6a960;border-color:#e6a960;color:#2b1a0e;font-weight:800;box-shadow:0 6px 0 #9a6431}
  #menu .mrow{display:flex;gap:8px;justify-content:center}#menu .mrow button{font-size:13px;padding:8px 12px;background:rgba(251,247,240,.12);color:#f6efe3;border-color:rgba(255,255,255,.2)}
  #menu .cup{position:absolute;bottom:-10px;right:6vw;width:min(220px,30vw);opacity:.9;pointer-events:none}
  /* kayıt yuvaları */
  .slot{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--cizgi);border-radius:14px;background:#fff;margin:10px 0}
  .slot .num{width:42px;height:42px;border-radius:12px;background:var(--kahve);color:#f7e6c8;display:flex;align-items:center;justify-content:center;font:800 20px "Fraunces",Georgia,serif;flex:none}
  .slot .info{flex:1;text-align:left}.slot .info b{display:block}.slot.empty .num{background:#cfc6b8}
  .slot .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  button.danger{color:var(--kotu);border-color:#e7b9ad}
  .toast{position:fixed;left:50%;top:56px;transform:translateX(-50%);background:rgba(43,33,23,.92);color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:10;max-width:90vw;text-align:center}
  .toast.on{opacity:1}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="hud" style="display:none">
  <span class="pill"><b id="hDay">Pzt</b> · <b id="hClock">08:00</b></span>
  <span class="pill" id="hRent"></span>
  <span class="pill money">₺<b id="hMoney">0</b></span>
  <span class="pill">İtibar <b id="hRep">0</b></span>
  <span class="pill" id="hStars">★</span>
  <span class="pill next" id="hNext"></span>
  <span class="pill debt" id="hDebt" style="display:none"></span>
  <span class="pill streak" id="hStreak" style="display:none"></span>
  <span class="sp"></span>
  <span class="pill xp" id="hRank"></span>
  <span class="pill xp" id="hStock"></span>
</div>
<div id="task" style="display:none"></div>
<div id="hint" style="display:none"></div>
<button id="openDay" class="pri" style="display:none">Dükkanı aç</button>
<div id="icons" style="display:none">
  <div class="icon" id="icBook" title="Kahve Defteri"><svg viewBox="0 0 24 24" fill="none" stroke="#2b2117" stroke-width="1.6"><path d="M5 4h11a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2V4z"/><path d="M5 4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2"/><path d="M9 8h6M9 12h6"/></svg>Defter</div>
  <div class="icon" id="icShop" title="Dükkan / Tedarik"><svg viewBox="0 0 24 24" fill="none" stroke="#2b2117" stroke-width="1.6"><path d="M4 8h16l-1 12H5L4 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>Tedarik<span class="badge" id="shopBadge" style="display:none">!</span></div>
  <div class="icon" id="icMenu" title="Menü"><svg viewBox="0 0 24 24" fill="none" stroke="#2b2117" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>Menü</div>
  <div class="icon" id="icSettings" title="Ayarlar"><svg viewBox="0 0 24 24" fill="none" stroke="#2b2117" stroke-width="1.6"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13.5a7.7 7.7 0 0 0 0-3l2-1.4-2-3.4-2.3.8a7.6 7.6 0 0 0-2.6-1.5L14 2h-4l-.5 2.4a7.6 7.6 0 0 0-2.6 1.5l-2.3-.8-2 3.4 2 1.4a7.7 7.7 0 0 0 0 3l-2 1.4 2 3.4 2.3-.8a7.6 7.6 0 0 0 2.6 1.5L10 22h4l.5-2.4a7.6 7.6 0 0 0 2.6-1.5l2.3.8 2-3.4-2-1.4z"/></svg>Ayarlar</div>
</div>

<div id="sheet"><div class="wrap" id="sheetBody"></div></div>

<div class="overlay" id="ovBook"><div class="card" id="bookCard"></div></div>
<div class="overlay" id="ovShop"><div class="card" id="shopCard"></div></div>
<div class="overlay" id="ovLedger"><div class="card" id="ledgerCard"></div></div>
<div class="overlay" id="ovSlots"><div class="card" id="slotsCard" style="max-width:520px"></div></div>
<div class="overlay" id="ovGameMenu"><div class="card" id="gameMenuCard" style="max-width:420px"></div></div>
<div class="overlay" id="ovModal"><div class="card" id="modalCard" style="max-width:460px"></div></div>
<div class="overlay" id="ovSettings"><div class="card" id="settingsCard" style="max-width:420px"></div></div>

<section id="menu">
  <div class="beans" aria-hidden="true"><span class="bean" style="left:6%;animation-duration:14s;animation-delay:-2s;transform:scale(1)"></span><span class="bean" style="left:15%;animation-duration:19s;animation-delay:-9s;transform:scale(0.8)"></span><span class="bean" style="left:24%;animation-duration:16s;animation-delay:-5s;transform:scale(1.2)"></span><span class="bean" style="left:37%;animation-duration:22s;animation-delay:-12s;transform:scale(0.7)"></span><span class="bean" style="left:48%;animation-duration:17s;animation-delay:-3s;transform:scale(1)"></span><span class="bean" style="left:58%;animation-duration:20s;animation-delay:-15s;transform:scale(0.9)"></span><span class="bean" style="left:67%;animation-duration:15s;animation-delay:-7s;transform:scale(1.1)"></span><span class="bean" style="left:76%;animation-duration:23s;animation-delay:-1s;transform:scale(0.75)"></span><span class="bean" style="left:85%;animation-duration:18s;animation-delay:-11s;transform:scale(1)"></span><span class="bean" style="left:93%;animation-duration:21s;animation-delay:-6s;transform:scale(0.85)"></span><span class="bean" style="left:31%;animation-duration:25s;animation-delay:-18s;transform:scale(0.6)"></span><span class="bean" style="left:72%;animation-duration:26s;animation-delay:-20s;transform:scale(0.65)"></span></div>
  <svg class="logo" viewBox="0 0 160 160" aria-hidden="true">
    <defs><radialGradient id="lgBean" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#b07a48"/><stop offset=".55" stop-color="#6b3f1e"/><stop offset="1" stop-color="#3a200e"/></radialGradient>
      <linearGradient id="lgShine" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
    <g class="steam"><path d="M66 40c-8-10 8-16 0-28"/><path d="M80 38c-8-10 8-16 0-28"/><path d="M94 40c-8-10 8-16 0-28"/></g>
    <g transform="rotate(-24 80 98)">
      <ellipse cx="80" cy="98" rx="40" ry="54" fill="url(#lgBean)"/>
      <path d="M80 46c-14 16 14 36 0 52s14 36 0 52" fill="none" stroke="#24120a" stroke-width="7" stroke-linecap="round"/>
      <ellipse cx="66" cy="78" rx="12" ry="24" fill="url(#lgShine)"/>
    </g>
  </svg>
  <h1>Coffe<span>Bean</span></h1>
  <p class="tag">Espresso çekmeyi öğren, dükkanı büyüt, dünyayı fincanda tat.</p>
  <div class="ver" id="menuVer">Sürüm</div>
  <div class="mbtns">
    <button class="pri" id="btnNew">Yeni oyun</button>
    <button id="btnContinue">Yükle</button>
    <button id="btnSettings">Ayarlar</button>
    <div style="display:none"><button id="btnExport"></button><button id="btnImport"></button></div>
    <input type="file" id="fileImport" accept="application/json" hidden>
  </div>
  <svg class="cup" viewBox="0 0 220 200" aria-hidden="true">
    <g class="steam"><path d="M92 70c-10-14 10-22 0-40"/><path d="M112 66c-10-14 10-22 0-40"/><path d="M132 70c-10-14 10-22 0-40"/></g>
    <ellipse cx="110" cy="186" rx="96" ry="12" fill="#2a1a10" opacity=".6"/>
    <path d="M40 90h140l-12 76c-2 12-12 20-24 20H76c-12 0-22-8-24-20z" fill="#f4ece0"/>
    <path d="M178 104c26 0 30 40 0 44" fill="none" stroke="#f4ece0" stroke-width="12"/>
    <ellipse cx="110" cy="90" rx="70" ry="12" fill="#5a3418"/><ellipse cx="110" cy="90" rx="58" ry="8" fill="#c48a4a" opacity=".7"/>
    <path d="M110 84c-8-6-12-2-10 2 2 3 10 6 10 6s8-3 10-6c2-4-2-8-10-2z" fill="#f7efe2"/>
  </svg>
</section>
<div class="toast" id="toast"></div>
<script>window.CB_VERSION = "0.10";</script>
<script src="data.js?v=0.10"></script>
<script src="audio.js?v=0.10"></script>
<script src="scene.js?v=0.10"></script>
<script src="closeup.js?v=0.10"></script>
<script src="game.js?v=0.10"></script>
</body>
</html>
