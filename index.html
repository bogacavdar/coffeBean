<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Çekirdek – Kahve Dükkanı (Prototip)</title>
<style>
  :root{
    --krema:#f6efe3; --kagit:#fbf7f0; --kahve:#4a3426; --karamel:#a9744f; --zeytin:#6f7d4a;
    --kiremit:#b5533c; --cizgi:#e4d9c6; --soluk:#8b7a6a; --iyi:#5f8a4b; --kotu:#b5533c; --uyari:#c9962b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--krema);color:var(--kahve);font:15px/1.45 "Segoe UI",system-ui,sans-serif;overflow:hidden}
  button{font:inherit;cursor:pointer;border:1px solid var(--cizgi);background:var(--kagit);color:var(--kahve);border-radius:10px;padding:8px 14px}
  button.pri{background:var(--kiremit);color:#fff;border-color:var(--kiremit)}
  button:disabled{opacity:.45;cursor:default}
  #app{display:flex;flex-direction:column;height:100%;max-width:960px;margin:0 auto}
  header{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:8px 12px;background:var(--kagit);border-bottom:1px solid var(--cizgi);font-size:14px}
  header b{color:var(--kiremit)}
  header .sp{flex:1}
  #shopWrap{position:relative;height:30vh;min-height:170px;max-height:300px;border-bottom:1px solid var(--cizgi);background:#e9e1d3}
  #shopCanvas{width:100%;height:100%;display:block;cursor:pointer}
  #queueHint{position:absolute;left:10px;bottom:6px;font-size:12px;background:rgba(251,247,240,.8);padding:2px 8px;border-radius:8px}
  #closeup{width:100%;max-width:480px;aspect-ratio:480/250;display:block;margin:4px auto;border-radius:12px;box-shadow:0 8px 24px rgba(40,25,10,.25)}
  main.zoom #counter .mg{animation:zoomIn .45s ease-out}
  @keyframes zoomIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
  .ctrl{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:6px;flex-wrap:wrap}
  .cust{flex:0 0 150px;background:var(--kagit);border:1px solid var(--cizgi);border-radius:12px;padding:8px;position:relative;cursor:pointer}
  .cust.active{outline:2px solid var(--kiremit)}
  .cust .nm{font-weight:600;font-size:13px}
  .cust .ord{font-size:13px;color:var(--kahve)}
  .cust .pat{height:5px;background:#e8dfd0;border-radius:3px;margin-top:6px;overflow:hidden}
  .cust .pat i{display:block;height:100%;background:var(--zeytin)}
  .cust .pat i.low{background:var(--kiremit)}
  .cust .tag{display:block;font-size:11px;color:var(--soluk);margin-top:2px}
  main{flex:1;position:relative;overflow:hidden}
  .screen{position:absolute;inset:0;overflow:auto;padding:14px 16px;display:none !important}
  .screen.on{display:block !important}
  #counter.on,#menu.on{display:flex !important}
  #counter{flex-direction:column;align-items:center;justify-content:flex-start;text-align:center}
  .mg{width:min(520px,100%);background:var(--kagit);border:1px solid var(--cizgi);border-radius:16px;padding:16px;margin:0 auto}
  .mg h3{margin:0 0 4px;font-size:18px}
  .mg .hint{color:var(--soluk);font-size:13px;min-height:18px}
  .steps{display:flex;gap:4px;justify-content:center;margin:8px 0 12px;flex-wrap:wrap}
  .steps span{font-size:11px;padding:2px 8px;border-radius:10px;background:#eee4d4;color:var(--soluk)}
  .steps span.done{background:var(--zeytin);color:#fff}
  .steps span.now{background:var(--kiremit);color:#fff}
  .gauge{position:relative;height:28px;background:#eee4d4;border-radius:14px;overflow:hidden;margin:14px 0}
  .gauge .zone{position:absolute;top:0;bottom:0;background:rgba(111,125,74,.35)}
  .gauge .needle{position:absolute;top:0;bottom:0;width:4px;background:var(--kahve);margin-left:-2px}
  .gauge .fill{position:absolute;top:0;bottom:0;left:0;background:var(--karamel)}
  .big{font-size:34px;font-weight:700;margin:6px 0}
  .ring{width:160px;height:160px;border-radius:50%;margin:10px auto;position:relative;background:#eee4d4;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none}
  .ring .band{position:absolute;border-radius:50%;border:10px solid rgba(111,125,74,.45)}
  .ring .r{position:absolute;border-radius:50%;border:4px solid var(--kahve)}
  .hold{width:100%;padding:18px;font-size:17px;border-radius:14px;user-select:none;touch-action:none}
  input[type=range]{width:100%}
  .score{font-size:15px;margin-top:8px;min-height:22px}
  .score.good{color:var(--iyi)} .score.bad{color:var(--kotu)}
  .tabs{display:flex;gap:6px;justify-content:center;margin-bottom:8px}
  .tabs button.on{background:var(--kahve);color:#fff}
  nav{display:flex;gap:6px;padding:8px 12px;background:var(--kagit);border-top:1px solid var(--cizgi)}
  nav button{flex:1}
  nav button.on{background:var(--kahve);color:#fff;border-color:var(--kahve)}
  table{border-collapse:collapse;width:100%;margin:8px 0;font-size:14px}
  td,th{padding:6px 8px;border-bottom:1px solid var(--cizgi);text-align:left;vertical-align:top}
  .card{background:var(--kagit);border:1px solid var(--cizgi);border-radius:12px;padding:12px;margin:10px 0}
  .card h4{margin:0 0 6px}
  .muted{color:var(--soluk);font-size:13px}
  .lock{opacity:.55}
  #modal{position:fixed;inset:0;background:rgba(40,28,20,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
  #modal.on{display:flex}
  #modal .box{background:var(--kagit);border-radius:16px;padding:20px;max-width:460px;width:100%;max-height:90vh;overflow:auto}
  #modal h3{margin:0 0 8px}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;justify-content:flex-end}
  #menu{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
  #menu h1{font-size:40px;margin:0;color:var(--kiremit);letter-spacing:1px}
  #menu p{max-width:420px;color:var(--soluk)}
  .toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:var(--kahve);color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:8}
  .toast.on{opacity:1}
  .cup{width:120px;height:90px;margin:8px auto;border-radius:0 0 50px 50px;background:#fff;border:3px solid var(--cizgi);position:relative;overflow:hidden}
  .cup i{position:absolute;left:0;right:0;bottom:0;background:#6b4a33;transition:height .4s}
  .cup i.milk{background:#f3e9dc;opacity:.9}
</style>
</head>
<body>
<div id="app">
  <header>
    <span>Gün <b id="hDay">1</b></span>
    <span>₺ <b id="hMoney">0</b></span>
    <span>İtibar <b id="hRep">0</b></span>
    <span id="hStars">★</span>
    <span class="sp"></span>
    <span id="hRank" class="muted"></span>
    <span class="muted" id="hBean"></span>
  </header>
  <div id="shopWrap"><canvas id="shopCanvas"></canvas><div id="queueHint" class="muted">Sırada bekleyen müşteriye dokun</div></div>
  <main>
    <section id="menu" class="screen on">
      <h1>Çekirdek</h1>
      <p>Espresso çekmeyi öğren, dükkanı büyüt, dünyayı fincanda tat. <br><span class="muted">Oynanabilir prototip – MVP kapsamı</span></p>
      <button class="pri" id="btnNew">Yeni oyun</button>
      <button id="btnContinue">Devam et</button>
      <div class="row" style="justify-content:center">
        <button id="btnExport">Kaydı dışa aktar</button>
        <button id="btnImport">Kaydı içe aktar</button>
        <input type="file" id="fileImport" accept="application/json" hidden>
      </div>
    </section>
    <section id="counter" class="screen"></section>
    <section id="shop" class="screen"></section>
    <section id="book" class="screen"></section>
  </main>
  <nav id="nav" style="display:none">
    <button data-s="counter" class="on">Tezgâh</button>
    <button data-s="shop">Dükkan</button>
    <button data-s="book">Kahve Defteri</button>
  </nav>
</div>
<div id="modal"><div class="box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>
<script src="data.js"></script>
<script src="scene.js"></script>
<script src="closeup.js"></script>
<script src="game.js"></script>
</body>
</html>
