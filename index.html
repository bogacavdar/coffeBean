<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>CoffeBean</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2b1a0e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CoffeBean">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
<style>
  :root{--krema:#f6efe3;--kagit:#fbf7f0;--kahve:#2b2117;--karamel:#a9744f;--zeytin:#6f7d4a;--kiremit:#b5533c;--cizgi:#e4d9c6;--soluk:#8b7a6a;--iyi:#5f8a4b;--kotu:#b5533c;--altin:#c9962b}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{margin:0;height:100%;background:#1c1713;color:var(--kahve);font:15px/1.45 "Segoe UI",system-ui,sans-serif;overflow:hidden}
  button{font:inherit;cursor:pointer;border:1px solid var(--cizgi);background:var(--kagit);color:var(--kahve);border-radius:10px;padding:8px 14px}
  button.pri{background:var(--kiremit);color:#fff;border-color:var(--kiremit)}
  button:disabled{opacity:.45;cursor:default}
  #scene{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:pointer}
  /* HUD – §11: büyük ve belirgin, tek bakışta okunur */
  #hud{position:fixed;top:0;left:0;right:0;display:flex;gap:10px;align-items:center;padding:12px 16px;background:linear-gradient(rgba(20,12,6,.85),rgba(20,12,6,.1));color:#f6efe3;font-size:19px;font-weight:600;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.7);flex-wrap:wrap;z-index:2}
  #hud b{color:#ffd89a;font-weight:800;font-size:1.08em}
  #hud .sp{flex:1}
  #hud .pill{background:rgba(0,0,0,.4);padding:6px 14px;border-radius:14px;border:1px solid rgba(255,216,154,.25)}
  #hud .pill.money b{color:#8fd97a}
  #hud .pill.xp{font-size:.82em}
  #hud .pill.warn{background:rgba(181,83,60,.75);border-color:#ffb49a}
  #hud .pill.debt{background:rgba(120,30,20,.6);color:#ffc9b8}
  #hud .pill.streak{background:rgba(201,150,43,.55)}
  #hud .pill.next{background:rgba(111,125,74,.6)}
  #task{position:fixed;top:66px;left:16px;z-index:2;background:rgba(251,247,240,.92);color:var(--kahve);padding:7px 14px;border-radius:14px;font-size:15px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.3);pointer-events:none;max-width:70vw}
  #task.done{background:rgba(111,125,74,.95);color:#fff}#task.failed{background:rgba(181,83,60,.9);color:#fff}
  /* köşe ikonları (§11) – büyük, kolay dokunulur */
  #icons{position:fixed;right:14px;bottom:14px;display:flex;flex-direction:column;gap:10px;z-index:3}
  .icon{width:72px;height:72px;border-radius:20px;background:rgba(251,247,240,.95);border:1px solid var(--cizgi);box-shadow:0 8px 22px rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:600;color:var(--kahve);cursor:pointer;position:relative}
  .icon svg{width:36px;height:36px}
  .icon .badge{position:absolute;top:-7px;right:-7px;background:var(--kiremit);color:#fff;border-radius:12px;font-size:12px;padding:2px 8px;font-weight:700}
  #orders{position:fixed;right:16px;top:84px;z-index:6;width:min(340px,70vw);background:rgba(251,247,240,.97);color:#3a2a1e;border-radius:18px;padding:12px 16px;box-shadow:0 10px 28px rgba(0,0,0,.35);border:3px solid #e6d6bf;pointer-events:none}
  #orders .ohead{font:800 20px "Fraunces",Georgia,serif;color:#5b3a22;margin-bottom:4px}
  #orders .ord{margin-top:8px;padding:8px 10px;background:#fff;border-radius:12px;box-shadow:0 2px 0 #e2d3bd}#orders .ord.bad{background:#fbe3dc}
  #orders .oname{font-size:14px;color:#8a7a68;font-weight:600}
  #orders .odrink{display:flex;align-items:center;gap:8px;font-size:21px;line-height:1.2}#orders .odrink b{color:#3a2414}
  #orders .osize{font-size:16px;font-weight:800;color:#fff;background:#b5533c;padding:3px 10px;border-radius:10px}
  #orders .ostate{font-size:14px;color:#b5533c;font-weight:700;margin-top:2px}
  #orders .oqhead{font-size:14px;font-weight:800;color:#8a7a68;margin-top:10px;border-top:2px dashed #e0cfb5;padding-top:6px}#orders .oq{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:4px}#orders .oq span{flex:0 0 auto;min-width:90px}#orders .oq .opat{flex:1;margin-top:0;height:7px}
  #orders .opat{height:8px;background:#eadfcf;border-radius:4px;margin-top:6px;overflow:hidden}#orders .opat i{display:block;height:100%;width:100%;background:#5f9a4b}
  tr.need td{background:rgba(181,83,60,.12)}
  #exitBtn{position:fixed;top:10px;right:12px;z-index:10;width:44px;height:44px;border-radius:14px;font-size:22px;font-weight:800;padding:0;background:rgba(251,247,240,.95);color:#b5533c;border:2px solid #e0cfb5;box-shadow:0 4px 12px rgba(0,0,0,.35)}
  #hud{padding-right:68px}
  #ovModal{z-index:11}
  #quitScreen{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 40%,#3b2717,#120b06);color:#f6efe3;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}#quitScreen h2{font:800 32px "Fraunces",Georgia,serif;margin:8px 0}#quitScreen p{color:#e6d6bf;font-size:18px}
  #cheats{position:fixed;right:96px;top:50%;transform:translateY(-50%);z-index:7;display:flex;flex-direction:column;gap:5px;background:rgba(20,14,9,.82);padding:8px;border-radius:14px;max-height:80vh;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.4)}#cheats .chead{color:#ffd89a;font-weight:800;font-size:14px;cursor:pointer;padding:2px 4px}#cheats button{font-size:13px;padding:6px 10px;text-align:left;white-space:nowrap}
  @media (max-width:620px){#cheats{right:70px;top:auto;bottom:70px;transform:none;max-height:55vh}}
  .diffs{display:flex;flex-direction:column;gap:10px;margin:10px 0}.diff{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:4px;padding:14px 16px;border-radius:14px;border:3px solid var(--cizgi);background:#fff;font-size:15px}.diff b{font:800 22px "Fraunces",Georgia,serif}.diff.easy{border-color:#5f9a4b}.diff.easy b{color:#3f7d34}.diff.normal{border-color:#c9962b}.diff.normal b{color:#8a6420}.diff.hard{border-color:#b5533c}.diff.hard b{color:#b5533c}.diff:hover{transform:scale(1.02)}
  .rentbig{font:800 34px "Fraunces",Georgia,serif;color:#3f6b2c;text-align:center;margin:10px 0 4px}.rentbig.due{color:#b5533c;animation:dayglow 1.3s ease-in-out infinite;border-radius:14px}
  .actbar{height:26px;max-width:640px;margin:16px auto 6px;background:#e6ddcd;border-radius:13px;overflow:hidden;box-shadow:inset 0 2px 7px rgba(0,0,0,.18)}.actbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6fae5f,#3f7d34);transition:width .12s}
  .acthint{font-size:18px;font-weight:700;color:var(--kahve);margin:4px 0}
  .cash{display:flex;align-items:center;justify-content:center;gap:12px;margin:6px auto 10px;padding:10px 18px;background:#e9f5e4;border:2px solid #4f9a44;border-radius:16px;max-width:360px}
  .cash span{font-size:32px;font-weight:800;color:#2f7a2a;font-variant-numeric:tabular-nums}.cash small{font-size:13px;color:#4f7a48;font-weight:700}
  /* §11 telefon dikey düzeni: bilgiler sol üstte küçük ve alt alta; bilgisayar/yatay ekran değişmez */
  @media (orientation:portrait) and (max-width:620px){
    #hud{right:auto;flex-direction:column;flex-wrap:nowrap;align-items:flex-start;gap:3px;padding:6px;font-size:11.5px;background:none;max-width:56vw}
    #hud .sp{display:none}
    #hud .pill{padding:2px 8px;border-radius:9px;line-height:1.3;background:rgba(20,12,6,.6)}
    #hud .pill.xp{font-size:1em}
    #orders{top:60px;right:8px;width:46vw;padding:8px 10px;border-radius:13px}#orders .odrink{font-size:16px}#orders .osize{font-size:13px;padding:2px 7px}#orders .ohead{font-size:15px}
    #task{top:auto;bottom:40px;left:8px;font-size:12px;padding:5px 10px;max-width:calc(100vw - 90px)}
    #openDay{top:auto;left:50%;bottom:84px;transform:translateX(-50%);font-size:17px;padding:12px 22px}
    #hint{left:8px;bottom:10px;font-size:11px}
    #icons{right:8px;bottom:8px;gap:7px}
    .icon{width:54px;height:54px;border-radius:15px;font-size:10.5px}
    .icon svg{width:26px;height:26px}
  }
  #openDay{position:fixed;left:16px;top:72px;z-index:3;font-size:19px;font-weight:800;padding:14px 26px;border-radius:16px;box-shadow:0 8px 0 #7d3424,0 12px 30px rgba(0,0,0,.35)}
  #openDay.glow{animation:dayglow 1.3s ease-in-out infinite}
  @keyframes dayglow{0%,100%{box-shadow:0 8px 0 #7d3424,0 0 0 0 rgba(255,216,154,.0)}50%{box-shadow:0 8px 0 #7d3424,0 0 0 10px rgba(255,216,154,.75),0 0 40px 12px rgba(255,200,120,.6)}}
  #hint{position:fixed;left:12px;bottom:14px;z-index:2;font-size:12px;color:#f6efe3;background:rgba(0,0,0,.4);padding:4px 10px;border-radius:10px;pointer-events:none}
  /* mini oyun paneli – §11: sahnenin ORTASINDA büyük bir kart, alttan şerit değil */
  #sheet{position:fixed;inset:0;background:rgba(20,14,9,.74);display:none;align-items:center;justify-content:center;padding:16px;z-index:5}
  #sheet.on{display:flex}
  #sheet .wrap{background:var(--kagit);border-radius:24px;box-shadow:0 26px 70px rgba(0,0,0,.5);max-width:760px;width:100%;max-height:96vh;overflow:auto;padding:16px 24px 20px;text-align:center}
  #sheet h3{margin:4px 0 2px;font-size:22px}
  .steps{display:flex;gap:6px;justify-content:center;margin:8px 0 10px;flex-wrap:wrap}
  .steps span{font-size:13px;padding:4px 11px;border-radius:12px;background:#eee4d4;color:var(--soluk)}
  .steps span.done{background:var(--zeytin);color:#fff}.steps span.now{background:var(--kiremit);color:#fff}
  #closeup{width:min(100%, calc(30vh * 640 / 340));max-width:640px;aspect-ratio:640/340;display:block;margin:4px auto;border-radius:16px;box-shadow:0 10px 30px rgba(40,25,10,.3)}
  .ctrl{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:10px;flex-wrap:wrap}
  .hold{width:100%;max-width:640px;padding:20px;font-size:18px;border-radius:16px;touch-action:none}
  input[type=range]{width:260px}
  .hint{color:var(--soluk);font-size:14px;min-height:18px;margin-top:8px}
  .score{font-size:16px;margin-top:6px;min-height:22px;font-weight:600}.score.good{color:var(--iyi)}.score.bad{color:var(--kotu)}
  .tabs{display:flex;gap:6px;justify-content:center;margin-bottom:6px}.tabs button.on{background:var(--kahve);color:#fff}
  /* §4 renkli hedef çubuğu */
  .zbar{position:relative;height:52px;max-width:640px;margin:16px auto 4px;background:#e6ddcd;border-radius:14px;box-shadow:inset 0 2px 7px rgba(0,0,0,.18)}
  .zbar .zb{position:absolute;top:0;bottom:0}.zbar .zb.ok{background:#e9c46a}.zbar .zb.good{background:#9cc77a}.zbar .zb.perf{background:#3f7d34}
  .zneedle{position:absolute;top:-7px;bottom:-7px;width:7px;margin-left:-3.5px;background:#111;border-radius:4px;box-shadow:0 0 0 2px rgba(255,255,255,.85),0 3px 8px rgba(0,0,0,.4)}
  .zends{display:flex;justify-content:space-between;align-items:center;max-width:640px;margin:2px auto 0;font-size:14px;color:var(--soluk);font-weight:600}
  .zleg{font-size:12px;font-weight:500}.zleg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin:0 3px 0 8px;vertical-align:-1px}.zleg i.perf{background:#3f7d34}.zleg i.good{background:#9cc77a}.zleg i.ok{background:#e9c46a}
  button.big{display:block;margin:14px auto 0;font-size:26px;font-weight:800;letter-spacing:1.5px;padding:22px;max-width:640px;width:100%;border-radius:18px;box-shadow:0 6px 0 #8d3b29}
  button.big:active{transform:translateY(4px);box-shadow:0 2px 0 #8d3b29}
  .zres{font-size:22px;font-weight:800;min-height:30px;margin-top:8px}.zres.perfect{color:#3f7d34}.zres.good{color:#5f8a4b}.zres.ok{color:#b58a1e}.zres.miss{color:var(--kotu)}
  .gauge{position:relative;height:12px;background:#eee4d4;border-radius:7px;overflow:hidden;max-width:360px;margin:8px auto}
  .gauge .zone{position:absolute;top:0;bottom:0;background:rgba(111,125,74,.5)}.gauge .needle{position:absolute;top:0;bottom:0;width:3px;background:var(--kahve)}
  .pulse{animation:pulse 1s infinite;outline:3px solid var(--altin);outline-offset:3px;border-radius:14px}
  @keyframes pulse{0%,100%{outline-color:rgba(201,150,43,.2)}50%{outline-color:rgba(201,150,43,1)}}
  /* öğretici balonu (§10) */
  #tut{display:none;background:#fff8e8;border:1px solid #e8d7a8;border-radius:14px;padding:8px 14px;margin:6px auto;max-width:640px;text-align:left;font-size:14px;position:relative}
  #tut.on{display:block}#tut b{color:var(--kiremit)}
  #tut::before{content:"Yıldız Teyze";display:block;font-size:11px;color:var(--soluk);margin-bottom:2px}
  /* tam ekran kartlar */
  .overlay{position:fixed;inset:0;background:rgba(28,23,19,.72);display:none;align-items:center;justify-content:center;padding:14px;z-index:9}
  .overlay.on{display:flex}
  .card{background:var(--kagit);border-radius:18px;width:100%;max-width:640px;max-height:92vh;overflow:auto;padding:18px 20px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .card h2{margin:0 0 6px;font-size:22px;display:flex;align-items:center;gap:8px}
  .card h2 .x{margin-left:auto;font-size:14px}
  .box{background:#fff;border:1px solid var(--cizgi);border-radius:12px;padding:12px;margin:10px 0}
  .box h4{margin:0 0 6px}
  table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:6px 8px;border-bottom:1px solid var(--cizgi);text-align:left;vertical-align:top}
  td.num{text-align:right;font-variant-numeric:tabular-nums}tr.total td{font-weight:700;border-top:2px solid var(--kahve)}
  .muted{color:var(--soluk);font-size:13px}.lock{opacity:.5}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;justify-content:flex-end}
  .req{font-size:13px;padding:6px 10px;border-radius:8px;background:#fdeeea;color:var(--kotu)}.req.ok{background:#eef5e8;color:var(--iyi)}
  .recipe{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--cizgi)}.recipe:last-child{border-bottom:0}.recipe .dIcon{flex:none}.recipe.lock{opacity:1}.recipe.lock b{color:var(--soluk);letter-spacing:2px}
  /* §2 gün sonu ekranları */
  .miss{background:#b5533c;color:#fff;font-weight:700;font-size:16px;padding:12px 14px;border-radius:12px;margin:8px 0;box-shadow:0 4px 0 #7d3424}
  .box.need{border:2px solid #b5533c;background:#fff4f1}
  .loanbtn{background:#fbe9e4;border-color:#e7b9ad;color:#7d3424;font-weight:700}
  .hubhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.hubhead .goal{margin-left:auto;background:#2b2117;color:#ffd89a;border-color:#2b2117;font-weight:800}
  .hubhead .x{cursor:pointer}
  .tabbar{display:flex;gap:6px;margin:12px 0 0;flex-wrap:wrap}
  .tabbar button{display:flex;align-items:center;gap:6px;border:2px solid var(--tc);color:var(--tc);background:#fff;border-radius:12px 12px 0 0;font-weight:700;padding:9px 12px}
  .tabbar button svg{width:20px;height:20px}.tabbar button.on{background:var(--tc);color:#fff}
  .tabbody{border-top:4px solid var(--tc);padding-top:4px}
  .ptable td{vertical-align:middle}.pbtns{display:flex;gap:6px;align-items:center;justify-content:flex-end}.pbtns button{padding:8px 12px}.pin{width:84px;padding:8px;border:2px solid var(--cizgi);border-radius:10px;font:700 18px inherit;text-align:center}
  .rx{font-size:12px;font-weight:600}.rx.ok{color:var(--iyi)}.rx.warn{color:#b58a1e}.rx.bad{color:var(--kotu)}.rx.cheap{color:#3b6ea8}
  .news{font-family:Georgia,"Fraunces",serif;background:#f7f1e3;border:1px solid #d9ccb0;padding:12px 14px;border-radius:8px}
  .news .nhead{font:900 22px Georgia,serif;letter-spacing:2px;border-bottom:3px double #2b2117;padding-bottom:6px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline}
  .news .nhead span{font:600 12px system-ui;letter-spacing:0;color:var(--soluk)}
  .setrow{display:flex;align-items:center;gap:10px}.setrow input[type=range]{flex:1;width:auto}
  .setrow input[type=checkbox]{width:18px;height:18px}
  /* §11 giriş ekranı: CoffeBean */
  #menu{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse 80% 60% at 50% 32%,#6b4426 0%,#3b2717 45%,#1a110b 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;z-index:8;color:#f6efe3;padding:16px}
  #menu::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 28%,rgba(255,200,120,.22),transparent 45%);pointer-events:none}
  #menu .beans{position:absolute;inset:0;pointer-events:none}
  #menu .bean{position:absolute;top:-60px;width:26px;height:36px;border-radius:50%;background:radial-gradient(ellipse at 35% 30%,#8a5a33,#4a2b16 70%,#2d190c);opacity:.35;animation:beanfall linear infinite}
  #menu .bean::after{content:"";position:absolute;left:46%;top:12%;bottom:12%;width:3px;border-radius:3px;background:rgba(25,12,4,.75);transform:rotate(10deg)}
  @keyframes beanfall{from{transform:translateY(-60px) rotate(0)}to{transform:translateY(calc(100vh + 120px)) rotate(360deg)}}
  #menu .logo{position:relative;width:150px;height:150px;filter:drop-shadow(0 12px 24px rgba(0,0,0,.5))}
  #menu .steam path{fill:none;stroke:rgba(255,240,220,.55);stroke-width:5;stroke-linecap:round;animation:steam 3.2s ease-in-out infinite}
  #menu .steam path:nth-child(2){animation-delay:1.1s}#menu .steam path:nth-child(3){animation-delay:2.1s}
  @keyframes steam{0%{opacity:0;transform:translateY(8px)}40%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
  #menu h1{position:relative;font-family:"Fraunces",Georgia,serif;font-weight:800;font-size:clamp(48px,9vw,82px);margin:0;line-height:1;letter-spacing:.5px;color:#f7e6c8;text-shadow:0 3px 0 #7a4a24,0 10px 30px rgba(0,0,0,.55)}
  #menu h1 span{color:#e6a960}
  #menu .tag{position:relative;max-width:440px;color:#e6d6bf;margin:4px 0 0;font-size:16px}
  #menu .ver{position:relative;font-size:12px;letter-spacing:2px;color:#b89a78;text-transform:uppercase;margin-bottom:8px}
  #menu .mbtns{position:relative;display:flex;flex-direction:column;gap:10px;width:min(320px,90vw)}
  #menu button{font-size:18px;padding:14px 28px;border-radius:16px}
  #menu button.pri{background:#e6a960;border-color:#e6a960;color:#2b1a0e;font-weight:800;box-shadow:0 6px 0 #9a6431}
  #menu .mrow{display:flex;gap:8px;justify-content:center}#menu .mrow button{font-size:13px;padding:8px 12px;background:rgba(251,247,240,.12);color:#f6efe3;border-color:rgba(255,255,255,.2)}
  #menu .cup{position:absolute;bottom:-10px;right:6vw;width:min(220px,30vw);opacity:.9;pointer-events:none}
  #menu .mtop{position:absolute;top:12px;right:12px;display:flex;gap:8px;z-index:2}
  #menu .mtop button{font-size:14px;padding:8px 12px;background:rgba(251,247,240,.14);color:#f6efe3;border-color:rgba(255,255,255,.25)}
  /* kayıt yuvaları */
  .slot{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--cizgi);border-radius:14px;background:#fff;margin:10px 0}
  .slot .num{width:42px;height:42px;border-radius:12px;background:var(--kahve);color:#f7e6c8;display:flex;align-items:center;justify-content:center;font:800 20px "Fraunces",Georgia,serif;flex:none}
  .slot .info{flex:1;text-align:left}.slot .info b{display:block}.slot.empty .num{background:#cfc6b8}
  .slot .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  /* §11 canlı paneller: büyük, okunaklı yazı; ürünler resimli kartlar */
  .card{font-size:17px;max-width:760px;padding:20px 24px;background:linear-gradient(#fbf7f0,#f3ebdf);border:3px solid #e6d6bf}
  .card h2{font-size:28px;font-family:"Fraunces",Georgia,serif;font-weight:800;color:#3a2414;padding-bottom:8px;border-bottom:3px dashed #e0cfb5;margin-bottom:12px}
  .card h2 .x{font-size:22px;padding:4px 10px;border-radius:10px;background:#efe3d2;cursor:pointer}
  .card .box{border:none;border-radius:16px;padding:14px 16px;margin:14px 0;box-shadow:0 4px 0 #e2d3bd,0 8px 18px rgba(60,35,15,.12)}
  .card .box h4{font-size:20px;font-family:"Fraunces",Georgia,serif;color:#5b3a22;margin:0 0 8px}
  .card table{font-size:17px;border-collapse:separate;border-spacing:0 8px}
  .card td{border:none;padding:10px 10px;vertical-align:middle;background:#fbf7f0}
  .card tr td:first-child{border-radius:14px 0 0 14px}.card tr td:last-child{border-radius:0 14px 14px 0;text-align:right;white-space:nowrap}
  .card tr{transition:transform .15s}.card tr:hover{transform:scale(1.015)}
  .card td b{font-size:18px;color:#3a2414}
  .card .muted{font-size:15px}
  .card button{font-size:17px;padding:10px 16px;border-radius:12px;font-weight:700;box-shadow:0 3px 0 #d8c7ae}
  .card button.pri{box-shadow:0 4px 0 #7d3424}
  .card button:disabled{box-shadow:none}
  .thumb{float:left;width:84px;height:64px;border-radius:12px;margin:0 12px 0 0;box-shadow:0 3px 8px rgba(60,35,15,.25);background:#efe5d6}
  .cash span{font-size:36px}
  @media (max-width:560px){.card{font-size:16px;padding:14px}.card h2{font-size:23px}.thumb{width:64px;height:50px}.card td{padding:8px 6px}.card td b{font-size:16px}}
  /* §11 ana menü: geniş ekranda büyük yazı */
  @media (min-width:900px){
    #menu .logo{width:200px;height:200px}
    #menu h1{font-size:clamp(82px,8vw,120px)}
    #menu .tag{font-size:22px;max-width:640px}
    #menu .ver{font-size:16px}
    #menu .mbtns{width:min(440px,90vw);gap:14px}
    #menu button{font-size:24px;padding:18px 34px}
    #menu .mrow button{font-size:18px;padding:12px 18px}
    #menu .mtop button{font-size:18px;padding:12px 16px}
    .slot{font-size:18px}.slot .num{width:54px;height:54px;font-size:26px}
  }
  button.danger{color:var(--kotu);border-color:#e7b9ad}
  .toast{position:fixed;left:50%;top:56px;transform:translateX(-50%);background:rgba(43,33,23,.92);color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:10;max-width:90vw;text-align:center}
  .toast.on{opacity:1}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="hud" style="display:none">

</div>

<div id="sheet"><div class="wrap" id="sheetBody"></div></div>

<div class="overlay" id="ovBook"><div class="card" id="bookCard"></div></div>
<div class="overlay" id="ovShop"><div class="card" id="shopCard"></div></div>
<div class="overlay" id="ovLedger"><div class="card" id="ledgerCard"></div></div>
<div class="overlay" id="ovHub"><div class="card" id="hubCard" style="max-width:760px"></div></div>
<div class="overlay" id="ovPrice"><div class="card" id="priceCard" style="max-width:760px"></div></div>
<div class="overlay" id="ovLoan"><div class="card" id="loanCard" style="max-width:600px"></div></div>
